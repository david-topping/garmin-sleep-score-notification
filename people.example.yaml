# Copy to people.yaml (gitignored) and fill in.
#
# people     = whoever's Garmin sleep score is fetched (needs a token store via auth-setup)
# recipients = the email addresses notified with that person's score
#
# Fan-out is free: many recipients per person, the same address under many people,
# receive-only people are just a recipient with no people entry of their own.

people:
  - name: wallace
    token_store: ~/.garmin_tokens/wallace
    recipients:
      - { label: Wallace, email: wallace@westwallaby.co.uk }
      - { label: Gromit, email: gromit@westwallaby.co.uk }

  - name: gromit
    token_store: ~/.garmin_tokens/gromit
    recipients:
      - { label: Gromit, email: gromit@westwallaby.co.uk }
      - { label: Feathers McGraw, email: feathers@penguin.co.uk }
